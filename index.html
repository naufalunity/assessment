<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kasatria – 3D People Table</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@tweenjs/tween.js": "https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@23.1.1/dist/tween.esm.js"
}}
</script>
<style>
  :root { --red:#EF3022; --orange:#FDA135; --green:#3A9F48; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; font-family: Helvetica, Arial, sans-serif; overflow:hidden; }

  /* ---------- Login screen (Image A) ---------- */
  #login { position:fixed; inset:0; background:#fff; display:flex; align-items:center; justify-content:center; z-index:10; }
  #login .card { width:min(440px, 90vw); padding:56px 32px; text-align:center; border:1px solid #eee; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  #login h1 { font-size:20px; font-weight:400; color:#333; margin:0 0 14px; }
  #login p  { font-size:11px; color:#555; margin:0 0 32px; }
  #gbtn { display:inline-flex; align-items:center; gap:12px; background:#4285f4; color:#fff; border:0; border-radius:6px; padding:8px 20px 8px 8px; font-size:13px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  #gbtn:hover { background:#3b78e0; }
  #gbtn .g { background:#fff; width:28px; height:28px; border-radius:4px; display:flex; align-items:center; justify-content:center; }
  #demoBtn { display:none; margin-top:18px; background:none; border:0; color:#4285f4; font-size:12px; cursor:pointer; text-decoration:underline; }
  #msg { color:#c5221f; font-size:12px; margin-top:16px; min-height:14px; }

  /* ---------- 3D scene ---------- */
  #app { position:fixed; inset:0; display:none; }
  #container { position:absolute; inset:0; }
  #menu { position:absolute; bottom:20px; left:0; right:0; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; z-index:5; }
  #menu button { color:rgba(127,255,255,.85); background:transparent; border:1px solid rgba(127,255,255,.6); padding:6px 12px; font-size:12px; cursor:pointer; }
  #menu button:hover { background:rgba(0,255,255,.5); color:#fff; }
  #menu button.active { background:rgba(0,255,255,.35); color:#fff; }
  #legend { display:flex; gap:12px; margin-left:24px; color:#fff; font-size:11px; align-items:center; border:1px solid #c00; padding:5px 10px; }
  #legend i { display:inline-block; width:10px; height:10px; margin-right:5px; vertical-align:middle; }
  #user { position:absolute; top:14px; right:16px; color:#9ff; font-size:12px; z-index:5; display:flex; gap:10px; align-items:center; }
  #user button { background:transparent; color:#9ff; border:1px solid rgba(127,255,255,.6); padding:4px 10px; cursor:pointer; font-size:11px; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#9ff; z-index:4; font-size:14px; }

  /* ---------- Tiles (Image B) ---------- */
  .tile { width:120px; height:160px; border:2px solid; border-radius:6px; text-align:center; cursor:default; color:#fff; position:relative; padding:8px 6px; }
  .tile:hover { filter:brightness(1.4); }
  .tile .country { position:absolute; top:6px; left:8px; font-size:11px; }
  .tile .age     { position:absolute; top:6px; right:8px; font-size:11px; }
  .tile img { width:84px; height:84px; object-fit:cover; margin-top:18px; background:#222; border-radius:2px; }
  .tile .name { font-size:11px; font-weight:bold; margin-top:8px; line-height:1.2; height:26px; overflow:hidden; }
  .tile .interest { font-size:10px; opacity:.85; margin-top:4px; }
  .tile.red    { border-color:var(--red);    background:rgba(239,48,34,.28);  box-shadow:0 0 12px rgba(239,48,34,.6); }
  .tile.orange { border-color:var(--orange); background:rgba(253,161,53,.28); box-shadow:0 0 12px rgba(253,161,53,.6); }
  .tile.green  { border-color:var(--green);  background:rgba(58,159,72,.28);  box-shadow:0 0 12px rgba(58,159,72,.6); }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>Welcome Back</h1>
    <p>Sign in with your Google account to view the data.</p>
    <button id="gbtn">
      <span class="g"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.9 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg></span>
      Sign in with Google
    </button>
    <div><button id="demoBtn">Preview with local data.csv (no login)</button></div>
    <div id="msg"></div>
  </div>
</div>

<div id="app">
  <div id="loading">Loading data…</div>
  <div id="container"></div>
  <div id="user"><span id="uname"></span><button id="signout">Sign out</button></div>
  <div id="menu">
    <button id="table">TABLE</button>
    <button id="sphere">SPHERE</button>
    <button id="helix">HELIX</button>
    <button id="grid">GRID</button>
    <button id="tetrahedron">TETRAHEDRON</button>
    <div id="legend">
      <span><i style="background:var(--red)"></i>&lt; $100K</span>
      <span><i style="background:var(--orange)"></i>$100K – $200K</span>
      <span><i style="background:var(--green)"></i>&gt; $200K</span>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import * as TWEEN from '@tweenjs/tween.js';
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

/* =====================  CONFIG – EDIT THESE  ===================== */
const CONFIG = {
  CLIENT_ID: '611879774099-l5l40ktno6bfo8ft2vl1abjkf0je74jt.apps.googleusercontent.com', // Google Cloud > Credentials > OAuth client ID (Web)
  SHEET_ID:  '1AZZ16-UvvJHRZjvB6Cqe8WMYaRSfgCgEWItjCUTFM6I',                       // the long id in the Sheet URL
  RANGE:     'A:F'                                         // Name, Photo, Age, Country, Interest, Net Worth
};
/* ================================================================ */

const SCOPES = 'https://www.googleapis.com/auth/spreadsheets.readonly https://www.googleapis.com/auth/userinfo.profile';
const configured = !CONFIG.CLIENT_ID.startsWith('YOUR_') && !CONFIG.SHEET_ID.startsWith('YOUR_');
const $ = id => document.getElementById(id);

/* ---------------------  Google login  --------------------- */
let tokenClient, accessToken = null;

function initAuth() {
  if (!configured) {
    $('msg').textContent = 'Set CLIENT_ID and SHEET_ID in index.html to enable Google login.';
    $('demoBtn').style.display = 'inline';
    return;
  }
  if (!window.google?.accounts) { setTimeout(initAuth, 150); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: SCOPES,
    callback: async resp => {
      if (resp.error) { $('msg').textContent = 'Login failed: ' + resp.error; return; }
      accessToken = resp.access_token;
      try { await start(await fetchSheet(), await fetchUserName()); }
      catch (e) { $('msg').textContent = e.message; }
    }
  });
}
$('gbtn').onclick = () => {
  if (!configured) { $('msg').textContent = 'Google login is not configured yet (see CONFIG in index.html).'; return; }
  tokenClient?.requestAccessToken({ prompt: 'select_account' });
};
$('demoBtn').onclick = async () => {
  try { await start(await fetchLocalCsv(), 'Demo mode'); }
  catch (e) { $('msg').textContent = 'Could not load data.csv (serve over http, not file://).'; }
};
$('signout').onclick = () => {
  if (accessToken && window.google) google.accounts.oauth2.revoke(accessToken, () => {});
  location.reload();
};
initAuth();

async function fetchUserName() {
  const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + accessToken } });
  return r.ok ? (await r.json()).name : '';
}

/* ---------------------  Data  --------------------- */
function rowsToPeople(rows) {
  const head = rows[0].map(h => h.trim().toLowerCase());
  const ix = k => head.indexOf(k);
  return rows.slice(1).filter(r => r[ix('name')]).map(r => ({
    name: r[ix('name')].trim(),
    photo: (r[ix('photo')] || '').trim(),
    age: (r[ix('age')] || '').trim(),
    country: (r[ix('country')] || '').trim(),
    interest: (r[ix('interest')] || '').trim(),
    worth: parseFloat(String(r[ix('net worth')] || '0').replace(/[^0-9.\-]/g, '')) || 0
  }));
}
async function fetchSheet() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${encodeURIComponent(CONFIG.RANGE)}`;
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
  if (!r.ok) {
    const t = r.status === 403 || r.status === 404 ? ' – is the Sheet shared with this Google account?' : '';
    throw new Error(`Sheets API error ${r.status}${t}`);
  }
  return rowsToPeople((await r.json()).values);
}
async function fetchLocalCsv() {
  const text = await (await fetch('data.csv')).text();
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rowsToPeople(rows);
}

/* ---------------------  3D scene  --------------------- */
let camera, scene, renderer, controls;
const objects = [];
const targets = { table: [], sphere: [], helix: [], grid: [], tetrahedron: [] };

function tier(w) { return w < 100000 ? 'red' : w > 200000 ? 'green' : 'orange'; }
// Spec: Red <100K, Orange >100K, Green >200K  → exactly 100K / 200K fall into the middle / orange tier.

async function start(people, userName) {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
  $('uname').textContent = userName || '';
  init(people);
  $('loading').style.display = 'none';
  transform(targets.table, 1500);
  animate();
}

function init(people) {
  camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 10000);
  camera.position.z = 3000;
  scene = new THREE.Scene();

  const N = people.length;
  people.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'tile ' + tier(p.worth);
    el.innerHTML = `
      <div class="country"></div><div class="age"></div>
      <img alt=""><div class="name"></div><div class="interest"></div>`;
    el.querySelector('.country').textContent = p.country;
    el.querySelector('.age').textContent = p.age;
    el.querySelector('.name').textContent = p.name;
    el.querySelector('.interest').textContent = p.interest;
    el.title = `${p.name} – $${p.worth.toLocaleString()}`;
    const img = el.querySelector('img');
    img.referrerPolicy = 'no-referrer';
    img.onerror = () => { img.removeAttribute('src'); };
    img.src = p.photo;

    const obj = new CSS3DObject(el);
    obj.position.set(Math.random() * 4000 - 2000, Math.random() * 4000 - 2000, Math.random() * 4000 - 2000);
    scene.add(obj);
    objects.push(obj);
  });

  // TABLE – 20 columns x 10 rows
  for (let i = 0; i < N; i++) {
    const o = new THREE.Object3D();
    o.position.set(((i % 20) - 9.5) * 140, -(Math.floor(i / 20) - 4.5) * 180, 0);
    targets.table.push(o);
  }

  // SPHERE
  const v = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    const phi = Math.acos(-1 + (2 * i) / N);
    const theta = Math.sqrt(N * Math.PI) * phi;
    const o = new THREE.Object3D();
    o.position.setFromSphericalCoords(1000, phi, theta);
    v.copy(o.position).multiplyScalar(2);
    o.lookAt(v);
    targets.sphere.push(o);
  }

  // DOUBLE HELIX – even tiles on strand A, odd tiles on strand B (offset by 180°)
  for (let i = 0; i < N; i++) {
    const strand = i % 2, k = Math.floor(i / 2);
    const theta = k * 0.35 + strand * Math.PI;
    const o = new THREE.Object3D();
    o.position.setFromCylindricalCoords(900, theta, -(k * 16) + 800);
    v.set(o.position.x * 2, o.position.y, o.position.z * 2);
    o.lookAt(v);
    targets.helix.push(o);
  }

  // GRID – 5 (z) x 4 (y) x 10 (x)
  for (let i = 0; i < N; i++) {
    const o = new THREE.Object3D();
    o.position.set(((i % 10) - 4.5) * 200, -(Math.floor(i / 10) % 4 - 1.5) * 260, (2 - Math.floor(i / 40)) * 500);
    targets.grid.push(o);
  }

  // TETRAHEDRON – distribute tiles across the four triangular faces
  const vertices = [
    new THREE.Vector3(900, 900, 900),
    new THREE.Vector3(900, -900, -900),
    new THREE.Vector3(-900, 900, -900),
    new THREE.Vector3(-900, -900, 900)
  ];
  const faces = [[0, 1, 2], [0, 1, 3], [0, 2, 3], [1, 2, 3]];
  faces.forEach((face, faceIndex) => {
    const count = Math.max(0, Math.ceil((N - faceIndex) / faces.length));
    if (!count) return;
    const rows = Math.ceil((Math.sqrt(8 * count + 1) - 1) / 2);
    const capacity = rows * (rows + 1) / 2;
    const points = [];
    for (let row = 0; row < rows; row++) {
      for (let column = 0; column <= row; column++) {
        points.push([
          1 - row / rows,
          (row - column) / rows,
          column / rows
        ]);
      }
    }

    const [a, b, c] = face.map(index => vertices[index]);
    const normal = new THREE.Vector3().add(a).add(b).add(c).normalize();
    for (let j = 0; j < count; j++) {
      const weights = points[Math.floor((j + 0.5) * capacity / count)];
      const inset = weights.map(weight => 0.12 + weight * 0.64);
      const o = new THREE.Object3D();
      o.position.copy(a).multiplyScalar(inset[0])
        .addScaledVector(b, inset[1])
        .addScaledVector(c, inset[2])
        .addScaledVector(normal, 40);
      o.lookAt(o.position.clone().add(normal));
      targets.tetrahedron[faceIndex + j * faces.length] = o;
    }
  });

  renderer = new CSS3DRenderer();
  renderer.setSize(innerWidth, innerHeight);
  $('container').appendChild(renderer.domElement);

  controls = new TrackballControls(camera, renderer.domElement);
  controls.minDistance = 500;
  controls.maxDistance = 6000;

  const buttons = ['table', 'sphere', 'helix', 'grid', 'tetrahedron'];
  buttons.forEach(name => $(name).onclick = () => {
    buttons.forEach(b => $(b).classList.toggle('active', b === name));
    transform(targets[name], 2000);
  });
  $('table').classList.add('active');

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function transform(list, duration) {
  TWEEN.removeAll();
  objects.forEach((obj, i) => {
    const t = list[i];
    new TWEEN.Tween(obj.position)
      .to({ x: t.position.x, y: t.position.y, z: t.position.z }, Math.random() * duration + duration)
      .easing(TWEEN.Easing.Exponential.InOut).start();
    new TWEEN.Tween(obj.rotation)
      .to({ x: t.rotation.x, y: t.rotation.y, z: t.rotation.z }, Math.random() * duration + duration)
      .easing(TWEEN.Easing.Exponential.InOut).start();
  });
}

function animate() {
  requestAnimationFrame(animate);
  TWEEN.update();
  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
